<script>
  /* Carry the path, query, and hash across so deep links keep working -- the
     Monday email links people straight to their own slot with ?slot=DATE/first,
     and that must survive the hop. replace() rather than assign() so the back
     button returns where the visitor came from instead of bouncing them here
     again. */
  (function () {
    var base = "https://grantseiter.com/labor-public";
    var path = location.pathname.replace(/^\/+/, "");
    location.replace(base + "/" + path + location.search + location.hash);
  })();
</script>
